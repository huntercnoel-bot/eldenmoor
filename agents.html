<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eldenmoor — Agent Forge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #f4e4c1; min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #2a2014 0%, #15100a 60%, #0d0905 100%);
    padding: 28px 18px 60px;
  }
  h1, .brand { font-family: Georgia, 'Times New Roman', serif; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 34px; letter-spacing: 3px; color: #ffd76a; text-shadow: 0 2px 10px rgba(0,0,0,0.7); }
  h1 span { color: #f4e4c1; }
  .sub { opacity: 0.62; font-size: 13px; margin-top: 4px; letter-spacing: 1px; }
  .bar { display: flex; gap: 14px; align-items: center; justify-content: center; margin: 16px 0 26px; flex-wrap: wrap; }
  .bar a, .bar button { font: 600 13px 'Trebuchet MS', sans-serif; color: #ffe08a; text-decoration: none; cursor: pointer;
    background: linear-gradient(180deg,#3c2d1a,#211710); border: 1px solid #b9892f; border-radius: 7px; padding: 8px 14px; }
  .bar button:hover, .bar a:hover { border-color: #ffd100; }
  .refreshed { font-size: 12px; opacity: 0.55; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 22px; max-width: 1080px; margin: 0 auto; }
  .card { background: linear-gradient(180deg, rgba(40,30,20,0.92), rgba(22,16,10,0.95));
    border: 2px solid #b9892f; border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 0 0 1px #3a2c18, 0 10px 30px rgba(0,0,0,0.6); }
  .card-head { display: flex; align-items: center; gap: 14px; padding: 16px 18px;
    background: linear-gradient(180deg, rgba(90,64,30,0.5), rgba(40,28,14,0.2)); border-bottom: 1px solid #6e572f; }
  .avatar { width: 54px; height: 54px; flex: none; display: grid; place-items: center; font-size: 30px;
    background: #0f0a05; border: 2px solid #6e572f; border-radius: 10px; }
  .who h2 { font-family: Georgia, serif; font-size: 21px; color: #ffd76a; }
  .who .focus { font-size: 13px; opacity: 0.8; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; padding: 5px 10px; border-radius: 999px; border: 1px solid; }
  .status.working { color: #a8e063; border-color: #4d7a2a; background: rgba(80,140,40,0.12); }
  .status.idle { color: #d8c79a; border-color: #6e572f; background: rgba(120,90,40,0.1); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .status.working .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(168,224,99,0.6); } 50% { opacity: 0.5; box-shadow: 0 0 0 6px rgba(168,224,99,0); } }

  .card-body { padding: 16px 18px; }
  .task { font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { font-size: 11px; font-family: monospace; background: #0f0a05; border: 1px solid #4a3a22; color: #d8c79a; border-radius: 5px; padding: 3px 7px; }
  .feed-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.6; margin-bottom: 8px; border-top: 1px solid #3a2c18; padding-top: 12px; }
  .commit { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed rgba(185,137,47,0.18); }
  .commit:last-child { border-bottom: none; }
  .commit .sha { font-family: monospace; font-size: 11px; color: #ffd76a; background: #0f0a05; border: 1px solid #4a3a22; border-radius: 4px; padding: 2px 6px; height: fit-content; }
  .commit .msg { font-size: 13px; line-height: 1.35; }
  .commit .when { font-size: 11px; opacity: 0.5; }
  .empty { font-size: 13px; opacity: 0.5; font-style: italic; padding: 6px 0; }
  footer { text-align: center; margin-top: 30px; font-size: 12px; opacity: 0.5; }
  .swords { font-size: 26px; }
</style>
</head>
<body>
  <header>
    <div class="swords">⚔️</div>
    <h1>ELDENMOOR <span>· Agent Forge</span></h1>
    <div class="sub">Who's shaping the realm — and what they're forging right now</div>
  </header>

  <div class="bar">
    <a href="./index.html">▶ Play the game</a>
    <button id="refresh">⟳ Refresh</button>
    <span class="refreshed" id="refreshed"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Live commits are pulled from GitHub when reachable, with a committed activity log as backup · the pulse means an agent is on the job.</footer>

<script>
const REPO = 'huntercnoel-bot/eldenmoor';
let COMMITS = [];

function ago(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

async function loadCommits() {
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/commits?per_page=40', { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    COMMITS = data.map(c => ({ sha: c.sha.slice(0, 7), msg: (c.commit.message || '').split('\n')[0], when: c.commit.author.date }));
    return true;
  } catch (e) { COMMITS = null; return false; }
}

function commitsFor(agent) {
  if (!COMMITS) return null;
  const kw = agent.match.map(m => m.toLowerCase());
  return COMMITS.filter(c => { const m = c.msg.toLowerCase(); return kw.some(k => m.includes(k)); }).slice(0, 6);
}

async function render() {
  const status = await (await fetch('agents-status.json?t=' + Date.now())).json();
  await loadCommits();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const a of status.agents) {
    const list = commitsFor(a);
    let feed;
    if (list && list.length) {
      // live commits from GitHub
      feed = list.map(c => `<div class="commit"><span class="sha">${c.sha}</span><div><div class="msg">${esc(c.msg)}</div><div class="when">${ago(c.when)}</div></div></div>`).join('');
    } else if (a.recent && a.recent.length) {
      // committed activity log (always available, no API needed)
      feed = a.recent.map(r => `<div class="commit"><span class="sha">✦</span><div><div class="msg">${esc(r)}</div></div></div>`).join('');
    } else {
      feed = '<div class="empty">No recent work yet.</div>';
    }

    grid.insertAdjacentHTML('beforeend', `
      <div class="card">
        <div class="card-head">
          <div class="avatar">${a.emoji}</div>
          <div class="who"><h2>${esc(a.name)}</h2><div class="focus">${esc(a.focus)}</div></div>
          <div class="status ${a.status === 'working' ? 'working' : 'idle'}"><span class="dot"></span>${a.status === 'working' ? 'Working' : 'Idle'}</div>
        </div>
        <div class="card-body">
          <div class="task">${esc(a.task)}</div>
          <div class="chips">${a.scope.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>
          <div class="feed-title">Recent work</div>
          ${feed}
        </div>
      </div>`);
  }
  document.getElementById('refreshed').textContent = 'updated ' + new Date().toLocaleTimeString();
}

document.getElementById('refresh').onclick = render;
render();
setInterval(render, 90000);   // auto-refresh every 90s (stays under the GitHub anon rate limit)
</script>
</body>
</html>
